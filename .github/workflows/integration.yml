# Integration test job. Boots a real Postgres service container, runs
# the Postgres-flavored Prisma migrations + seed, then executes the
# `*.integration.test.ts` suite under `apps/web/tests/integration/`.
#
# Separate workflow from docker-build.yml so:
#   - The fast unit-test + Docker pipeline isn't blocked on Postgres
#     boot when integration coverage isn't relevant for a PR.
#   - This job can be re-run independently if Postgres provisioning
#     ever flakes without invalidating the build cache.
#
# Trigger: every push, plus manual dispatch.
name: integration

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wow_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wow -d wow_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wow:wow@localhost:5432/wow_integration?schema=public
      DIRECT_DATABASE_URL: postgresql://wow:wow@localhost:5432/wow_integration?schema=public
      # Drives the Prisma extension + backfill smoke. 32 bytes / 64 hex.
      PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # 16+ hex chars, used as HMAC key for the search-hash columns.
      PII_HASH_KEY: deadbeefcafef00d
      # The upstash integration spec needs a deeper fetch stub to fully
      # simulate Upstash's REST publish/subscribe round-trip; the unit
      # test on events/bus.ts already covers the dedupe + reconnect
      # branches at the function level. Leave the spec opt-in via
      # INTEGRATION_UPSTASH=1 once the stub is fleshed out.
      INTEGRATION_UPSTASH: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Postgres Prisma client
        run: pnpm --filter @wow/db generate:pg

      - name: Apply Postgres migrations
        run: pnpm --filter @wow/db migrate:deploy:pg

      - name: Seed baseline data
        run: pnpm --filter @wow/db seed
        env:
          # Seed script reads DATABASE_URL; reuse the same Postgres URL.
          DATABASE_URL: postgresql://wow:wow@localhost:5432/wow_integration?schema=public

      - name: Run integration tests
        run: pnpm --filter @wow/web test:integration
